# Compile-check the iOS app on a macOS runner (US-1612).
#
# This exists because the iOS source was written on Windows and has never been
# through a compiler. It builds for the SIMULATOR with signing disabled, so it
# needs NO Apple Developer account and NO certificates — the only question it
# answers is "does the Swift compile", which is the one that matters right now.
#
# Producing an installable .ipa is a separate job that DOES need an Apple
# account; add it once this one is green.
name: iOS build check

on:
  push:
    paths:
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build-check.yml'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  compile:
    # macOS runners are billed at 10x on private repos — this job is deliberately
    # small, and `paths:` above keeps it from running on Android-only commits.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 requires >=22; the CLI refuses to run on 20.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Copies web assets and plugin definitions into the native project.
      # NEVER `cap add ios` here — that regenerates the folder and would wipe
      # PortalViewController.swift and the storyboard/Info.plist changes.
      - name: Capacitor sync
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for the Simulator (no signing)
        run: |
          cd ios/App
          xcodebuild \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="x86_64 arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            | tee build.log
        # `set -o pipefail` is not on by default in a bash step, so without this
        # a failing xcodebuild would be masked by tee's exit code.
        shell: bash --noprofile --norc -eo pipefail {0}

      # A green build proves nothing if our file was never in the target. The
      # project.pbxproj registration was hand-written, and an unregistered file
      # is silently skipped - so assert the compiler actually saw it.
      - name: Verify PortalViewController.swift was compiled
        run: |
          cd ios/App
          if grep -q "PortalViewController.swift" build.log; then
            echo "OK - the compiler processed PortalViewController.swift"
            grep -m3 "PortalViewController" build.log
          else
            echo "FAIL - PortalViewController.swift never reached the compiler."
            echo "It is missing from the App target in project.pbxproj."
            exit 1
          fi

      # Appetize.io runs SIMULATOR builds (.app) - no signing, no bundle-id
      # restriction - so this artifact is testable from a browser with no Apple
      # Developer account and no Mac. Zipped because a .app is a DIRECTORY and
      # upload-artifact would otherwise flatten it into loose files.
      # A storyboard class reference is resolved at RUNTIME, so a wrong one
      # compiles fine and then crashes on launch with "Unknown class ...".
      # customModuleProvider="target" is what tells UIKit the class lives in
      # THIS app target; without it "App" is read as a framework name and the
      # class is never found. Cost us one crash - assert it stays.
      - name: Verify the storyboard class reference is complete
        run: |
          SB=ios/App/App/Base.lproj/Main.storyboard
          grep -q 'customClass="PortalViewController"' "$SB" || { echo "FAIL: storyboard does not point at PortalViewController"; exit 1; }
          grep -q 'customModuleProvider="target"' "$SB" || { echo "FAIL: customModuleProvider=\"target\" missing - the app will crash on launch"; exit 1; }
          echo "OK - storyboard resolves PortalViewController from the app target"

      # A green build says the code COMPILES. It says nothing about whether the
      # app can start - storyboard wiring, missing Info.plist keys and bad
      # selectors all fail at runtime. So actually boot a simulator and launch
      # it, then dump whatever iOS logged. Non-fatal: we want the log either way.
      # The previous version of this step launched with --console-pty and then
      # KILLED that process, so "not running" proved nothing and a green result
      # was meaningless. Launch DETACHED, let it live, then check whether the
      # process is still alive and dump any crash report. Fails the job if the
      # app died - a build that cannot stay running is not a passing build.
      # Keep this output SHORT. An earlier version grepped for "Terminating",
      # which matches unrelated simulator daemons hundreds of times and buried
      # the actual crash. Only patterns that indicate OUR failure belong here.
      - name: Launch in a simulator and prove it stays running
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          rm -f ~/Library/Logs/DiagnosticReports/App-*.ips 2>/dev/null || true
          xcrun simctl launch "$UDID" it.ustyle.portal || true
          sleep 20
          if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q it.ustyle.portal; then
            echo "RESULT: STILL RUNNING"; exit 0
          fi
          echo "RESULT: THE APP DIED"
          echo
          echo "=========== CRASH REPORT (full) ==========="
          FOUND=0
          for f in ~/Library/Logs/DiagnosticReports/App-*.ips; do
            [ -e "$f" ] || continue
            FOUND=1
            python3 ci/parse-crash.py "$f" || cat "$f"
          done
          [ "$FOUND" = "1" ] || echo "(no .ips crash report found)"
          echo "=========== WHAT THE APP ITSELF LOGGED ==========="
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'processImagePath CONTAINS "App.app"' 2>/dev/null | tail -40 || true
          echo
          echo "=========== HARD FAILURE SIGNATURES ==========="
          xcrun simctl spawn "$UDID" log show --last 3m --style compact 2>/dev/null > /tmp/full.log || true
          grep -aiE "Unknown class|uncaught exception|NSInvalidArgument|Library not loaded|Symbol not found|dyld:|Fatal error|SIGABRT|EXC_" /tmp/full.log | head -20 || echo "(none found)"
          exit 1

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: |
            ~/Library/Logs/DiagnosticReports/App-*.ips
            /tmp/full.log
          if-no-files-found: ignore

      - name: Package the .app for Appetize
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r -q "$GITHUB_WORKSPACE/App-simulator.zip" App.app
          echo "zipped: $(du -h "$GITHUB_WORKSPACE/App-simulator.zip" | cut -f1)"
          echo "architectures in the binary:"
          lipo -info App.app/App || file App.app/App

      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: App-simulator.zip

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/App/build.log
